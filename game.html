<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 Trivia Night</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;cursor:none}
  .slide{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s ease;pointer-events:none}
  .slide.on{opacity:1}
  .slide img{max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}
  .slide iframe{border:0;width:100vw;height:100vh}
  #counter{position:fixed;right:1vw;bottom:1vh;font:1.4vh Arial,sans-serif;color:#444;opacity:0;transition:opacity .3s}
  body.peek #counter{opacity:1}
</style>
</head>
<body>
<div id="deck"></div>
<div id="counter"></div>
<script>

/* ===== HOW TO UPDATE THIS GAME EACH WEEK =====

   SLIDES
   1. In PowerPoint, export the deck as images:
      Mac:     File > Export > File Format: JPEG > Save Every Slide
      Windows: File > Export > Change File Type > JPEG > All Slides
   2. Keep PowerPoint's file names (Slide1.jpg, Slide2.jpg, ...).
   3. Upload them into the "deck" folder in the repo (open the folder on
      github.com, then Add file > Upload files). Same-named files are replaced.
   4. To fix one slide: export only that slide (Mac: Save Current Slide Only;
      Windows: Just This One) and upload it into "deck" the same way.

   SETTINGS BELOW (use PowerPoint's slide numbers)
   - SLIDE_COUNT: the total number of slides in the deck.
   - SKIP: slides to leave out, such as hidden slides or answer lists.
     Example: [13]. Use [] if none.
   - SCOREBOARD_AFTER: the slides the live scoreboard follows, usually each
     break slide and the last answer slide of the final round.
     Example for Rounds 1-2, break, Rounds 3-4, break, final:
     [<break 1 slide>, <break 2 slide>, <last final answer slide>]

   SCORESHEET
   - Keep the file named Scoresheet.xlsx and upload it to the repo's top
     folder at each break. Leave unused rounds (for example R5 and R6) blank.
   - The scoreboard labels itself ("After Round 2", "After Round 4",
     "Final Scores") from whichever rounds have scores.
   - Start each game night by uploading a blank Scoresheet.xlsx.

   index.html is the scoreboard. It needs no weekly changes.
   ============================================== */
 
/* ===== Settings ===== */
/* Slide numbers match PowerPoint's. Images live in the "deck" folder, named the way
   PowerPoint exports them: Slide1.jpg, Slide2.jpg ... (.jpeg and .png work too). */
const SLIDE_COUNT = 57;
/* Slides to leave out (hidden slides, answer lists you don't want on the TV). */
const SKIP = [13];
/* The live scoreboard is shown right after these slide numbers. */
const SCOREBOARD_AFTER = [14, 33, 52, 56];
/* ==================== */

const NAMES = n => ["jpg","jpeg","JPG","JPEG","png","PNG"].map(x => `deck/Slide${n}.${x}`);
const seq = [];
for (let i = 1; i <= SLIDE_COUNT; i++){
  if (!SKIP.includes(i)) seq.push({type:"img", n:i, srcs:NAMES(i)});
  if (SCOREBOARD_AFTER.includes(i)) seq.push({type:"board"});
}
const deck = document.getElementById("deck");
const board = document.createElement("div");
board.className = "slide";
board.innerHTML = '<iframe src="index.html" title="Scoreboard" style="pointer-events:none"></iframe>';
deck.appendChild(board);
const sb = () => board.querySelector("iframe").contentWindow;

seq.forEach(s => {
  if (s.type !== "img") { s.el = board; return; }
  const d = document.createElement("div"); d.className = "slide";
  const im = document.createElement("img"); let k = 0;
  /* Try each file name PowerPoint might have used until one loads. */
  im.onerror = () => { if (++k < s.srcs.length) im.src = s.srcs[k]; else d.innerHTML = `<p style="color:#666;font:3vh Arial">Slide ${s.n} image not found in the deck folder</p>`; };
  im.src = s.srcs[0]; d.appendChild(im);
  deck.appendChild(d); s.el = d;
});

let cur = Math.min(seq.length - 1, Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
function show(i, fromBack){
  cur = Math.max(0, Math.min(seq.length - 1, i));
  document.querySelectorAll(".slide.on").forEach(el => el.classList.remove("on"));
  seq[cur].el.classList.add("on");
  history.replaceState(null, "", "#" + (cur + 1));
  document.getElementById("counter").textContent = seq[cur].type === "board" ? "Scoreboard" : `Slide ${seq[cur].n}`;
  if (seq[cur].type === "board" && !fromBack){ try{ sb().replay(); }catch(e){} }
}
function onBoard(){ return seq[cur].type === "board"; }
function next(){
  if (onBoard()){
    let w; try{ w = sb(); }catch(e){}
    if (w && w.busy && w.busy()) return;                  /* still on "Scores coming up" */
    if (w && w.allShown && !w.allShown()){ w.revealNext(); return; }
  }
  show(cur + 1);
}
function prev(){
  if (onBoard()){
    let w; try{ w = sb(); }catch(e){}
    if (w && w.shownCount && w.shownCount() > 0 && !w.busy()){ w.hideLast(); return; }
  }
  show(cur - 1, true);
}
document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === " " || k === "ArrowRight" || k === "PageDown" || k === "Enter"){ e.preventDefault(); next(); }
  else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace"){ e.preventDefault(); prev(); }
  else if (k === "Home"){ show(0, true); }
  else if (k === "End"){ show(seq.length - 1, true); }
  else if ((k === "a" || k === "A") && onBoard()){ try{ sb().revealAll(); }catch(err){} }
  else if (k === "f" || k === "F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
document.addEventListener("click", next);
document.addEventListener("contextmenu", e => { e.preventDefault(); prev(); });
/* Moving the mouse briefly shows the slide number in the corner. */
let peekTimer; document.addEventListener("mousemove", () => { document.body.classList.add("peek"); clearTimeout(peekTimer); peekTimer = setTimeout(() => document.body.classList.remove("peek"), 1500); });
show(cur, true);
</script>
</body>
</html>
