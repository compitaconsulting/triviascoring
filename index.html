<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia Night Scoreboard</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{--gold:#ffd54a;--silver:#d6e2ea;--bronze:#ff9f5a;--cyan:#38e8ff;--up:#3dff9a;--down:#ff4d6d;--row:#0e1424}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",Arial,sans-serif;color:#fff;overflow:hidden;display:flex;flex-direction:column;padding:4vh 8vw 2.5vh;
    background:
      radial-gradient(ellipse at 50% -10%,rgba(56,232,255,.18),transparent 55%),
      radial-gradient(ellipse at 100% 110%,rgba(140,80,255,.18),transparent 50%),
      linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/100% 4vh,
      linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/4vh 100%,
      #05060b;}
  .head{text-align:center;margin-bottom:3vh}
  .logo{position:absolute;top:2.5vh;left:2.5vw;height:14vh;background:radial-gradient(circle closest-side,#fff 96%,transparent 97%)}
  body.waiting .logo{display:none}
  .wait img{height:30vh;background:radial-gradient(circle closest-side,#fff 96%,transparent 97%)}
  h1{font-size:6.5vh;font-weight:800;letter-spacing:.35em;padding-left:.35em;
     text-shadow:0 0 1.2vh rgba(56,232,255,.75),0 0 4vh rgba(56,232,255,.35)}
  .sub{font-size:2.6vh;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);margin-top:.8vh;min-height:3vh;opacity:.9}
  #board{flex:1;display:flex;flex-direction:column;gap:1vh;min-height:0}
  .row{flex:1;max-height:9vh;min-height:0;display:grid;grid-template-columns:var(--fs2) 6vw 1fr 9vw;align-items:center;gap:1.5vw;
       padding:0 1.5vw;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-radius:1vh;
       font-size:var(--fs);opacity:0;transform:translateX(-4vw)}
  .row.show{animation:slide .55s cubic-bezier(.2,.8,.2,1) forwards}
  .row.hide{opacity:0;transform:translateX(-4vw);animation:none}
  #board.nomove .row{grid-template-columns:var(--fs2) 0 1fr 9vw}
  @keyframes slide{to{opacity:1;transform:none}}
  .rank{width:var(--fs2);height:var(--fs2);border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:.8em;background:rgba(255,255,255,.08);color:#cfd6e4}
  .move{font-size:.6em;font-weight:800;letter-spacing:.05em;text-align:center}
  .move.up{color:var(--up)} .move.down{color:var(--down)} .move.same{color:#4a5468} .move.new{color:var(--cyan)}
  .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .p1{background:linear-gradient(90deg,rgba(255,213,74,.28),rgba(255,213,74,.05));box-shadow:0 0 2.5vh rgba(255,213,74,.35),inset 0 0 0 .15vh rgba(255,213,74,.7)}
  .p2{background:linear-gradient(90deg,rgba(214,226,234,.2),rgba(214,226,234,.04));box-shadow:0 0 2vh rgba(214,226,234,.2),inset 0 0 0 .15vh rgba(214,226,234,.55)}
  .p3{background:linear-gradient(90deg,rgba(255,159,90,.22),rgba(255,159,90,.04));box-shadow:0 0 2vh rgba(255,159,90,.25),inset 0 0 0 .15vh rgba(255,159,90,.6)}
  .p1 .rank{background:var(--gold);color:#1a1300} .p2 .rank{background:var(--silver);color:#11161a} .p3 .rank{background:var(--bronze);color:#1f0e00}
  .p1 .score{color:var(--gold);text-shadow:0 0 1.5vh rgba(255,213,74,.6)}
  .wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
  .wait b{font-size:7vh;font-weight:800;letter-spacing:.1em;text-shadow:0 0 2vh rgba(56,232,255,.5)}
  .dots span{display:inline-block;width:1.4vh;height:1.4vh;margin:0 .6vh;border-radius:50%;background:var(--cyan);animation:pulse 1.2s infinite ease-in-out}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  .loadbar{width:36vw;height:1vh;border-radius:1vh;background:rgba(56,232,255,.15);overflow:hidden;margin-top:1vh}
  .loadbar i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:0 0 2vh var(--cyan);animation:fill var(--hold) linear forwards}
  @keyframes fill{to{width:100%}}
  .hint{position:fixed;left:0;right:0;bottom:12vh;text-align:center;font-size:2.4vh;letter-spacing:.3em;text-transform:uppercase;
        color:var(--cyan);animation:blink 1.6s ease-in-out infinite;pointer-events:none}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}
  #status{font-size:1.6vh;color:#5a6478;text-align:right;margin-top:1vh}
  #status a{color:#8a96ad}
</style>
</head>
<body class="waiting">
<img class="logo" src="d2-logo.png" alt="D2 Productions">
<div class="head"><h1>SCOREBOARD</h1><div class="sub" id="sub"></div></div>
<div id="board"><div class="wait"><img src="d2-logo.png" alt=""><b>Scores coming up</b><div class="dots"><span></span><span></span><span></span></div></div></div>
<div id="status">Checking GitHub for the scoresheet</div>
<script>
/* ===== Settings ===== */
/* The scoresheet's file name in the repo. Keep it the same all night. */
const FILE = "Scoresheet.xlsx";
const POLL_SECONDS = 15;
/* How long "Scores coming up" shows, with its loading bar, before new scores appear. */
const HOLD_MS = 2500;
/* true: click, Space, or Right Arrow shows one team at a time, last place first.
   Left Arrow hides the last one shown. A shows all. false: every team appears on its own. */
const STEP_REVEAL = true;
/* ==================== */


/* ---- parsing (kept free of page code so it can be tested) ---- */
function parseScores(wb){
  const norm = v => String(v ?? "").trim();
  const num = v => (typeof v === "number" && isFinite(v)) ? v : (norm(v) !== "" && !isNaN(+norm(v)) ? +norm(v) : null);
  const views = (wb.Workbook && wb.Workbook.Views) || [];
  const active = views.length ? (views[0].activeTab || 0) : 0;
  const order = [wb.SheetNames[active], ...wb.SheetNames.filter((_,i)=>i!==active)].filter(Boolean);
  for (const name of order){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
    for (let h = 0; h < Math.min(rows.length, 20); h++){
      const hdr = (rows[h] || []).map(c => norm(c).toUpperCase());
      const teamCol = hdr.findIndex(c => /^TEAM/.test(c));
      if (teamCol < 0) continue;
      const totalCol = hdr.findIndex(c => /^(TOTAL|FINAL TOTAL|GRAND TOTAL)$/.test(c));
      const wagerCol = hdr.findIndex(c => /^WAGER/.test(c));
      const rightCol = hdr.findIndex(c => /^RIGHT/.test(c));
      const roundCols = hdr.map((c,i)=>({c,i})).filter(o => /^(R\s?\d+|ROUND\s?\d+)$/.test(o.c)).map(o=>o.i);
      const played = roundCols.map(() => false);
      const teams = [];
      let finalDone = false;
      for (let r = h+1; r < rows.length; r++){
        const row = rows[r] || [];
        const team = norm(row[teamCol]);
        if (!team || /^(TEAM|TOTALS?|AVERAGE|AVG|MEAN)$/i.test(team)) continue;
        let roundSum = 0;
        roundCols.forEach((ci, k) => { const v = num(row[ci]); if (v !== null){ roundSum += v; if (v !== 0) played[k] = true; } });
        const wager = wagerCol >= 0 ? num(row[wagerCol]) : null;
        if (wager && rightCol >= 0 && norm(row[rightCol]) !== "") finalDone = true;
        const t = totalCol >= 0 ? num(row[totalCol]) : null;
        const anyScore = t !== null || roundCols.some(ci => num(row[ci]) !== null);
        if (!anyScore) continue;  /* notes or labels under the table */
        teams.push({team, total: t !== null ? t : roundSum});
      }
      if (teams.length){
        teams.sort((a,b) => b.total - a.total || a.team.localeCompare(b.team));
        let rank = 0, prev = null;
        teams.forEach((t,i) => { if (t.total !== prev){ rank = i+1; prev = t.total; } t.rank = rank; });
        const lastRound = played.lastIndexOf(true) + 1;
        return {sheet:name, teams, lastRound, finalDone};
      }
    }
  }
  return {sheet:null, teams:[], lastRound:0, finalDone:false};
}
/* ---- end parsing ---- */


function fmt(v){ return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function countUp(el){
  const a = +el.dataset.from, b = +el.dataset.to, start = performance.now(), dur = 1200;
  (function step(now){
    const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = k < 1 ? String(Math.round(a + (b - a) * e)) : fmt(b);
    if (k < 1) requestAnimationFrame(step);
  })(start);
}
/* Step-by-step reveal: rows are counted from the bottom (last place) up. */
let shown = 0;
function rows(){ return [...document.querySelectorAll("#board .row")]; }
function dropHint(){ const h = document.querySelector(".hint"); if (h) h.remove(); }
function showRow(el){ dropHint(); el.classList.remove("hide"); el.classList.add("show"); setTimeout(() => countUp(el.querySelector(".score")), 250); }
function revealNext(){
  const r = rows(); if (shown >= r.length) return;
  shown++; showRow(r[r.length - shown]);
}
function hideLast(){
  const r = rows(); if (!shown) return;
  const el = r[r.length - shown]; shown--;
  el.classList.remove("show"); el.classList.add("hide");
  const s = el.querySelector(".score"); s.textContent = fmt(+s.dataset.from);
}
function revealAll(stagger){
  const r = rows();
  for (let k = shown; k < r.length; k++){ const el = r[r.length - 1 - k]; setTimeout(() => showRow(el), (k - shown) * (stagger || 60)); }
  shown = r.length;
}
/* Remembers the last board (in this browser only) so arrows show who moved. Ignored after 6 hours. */
function loadPrev(){
  try{ const p = JSON.parse(localStorage.getItem("triviaPrev") || "null"); return p && Date.now() - p.at < 6*3600e3 ? p : null; }catch(e){ return null; }
}
function savePrev(teams, stage){
  try{ localStorage.setItem("triviaPrev", JSON.stringify({at:Date.now(), stage:stage||0, ranks:Object.fromEntries(teams.map(t=>[t.team,t.rank])), totals:Object.fromEntries(teams.map(t=>[t.team,t.total]))})); }catch(e){}
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(res){
  const board = document.getElementById("board");
  document.getElementById("sub").textContent = res.finalDone ? "Final Scores" : (res.lastRound ? `After Round ${res.lastRound}` : "");
  document.body.classList.toggle("waiting", !res.teams.length);
  if (!res.teams.length){
    board.innerHTML = '<div class="wait"><img src="d2-logo.png" alt=""><b>Scores coming up</b><div class="dots"><span></span><span></span><span></span></div></div>';
    return;
  }
  const n = res.teams.length;
  const fs = Math.max(2.3, Math.min(4.6, (68 / n - 1) / 1.25));
  board.style.setProperty("--fs", fs + "vh");
  board.style.setProperty("--fs2", (fs * 1.45) + "vh");
  const prev = res.prev !== undefined ? res.prev : loadPrev();
  board.classList.toggle("nomove", !prev);
  board.innerHTML = res.teams.map((t,i) => {
    let mv = "", cls = "same";
    if (prev){
      const p = prev.ranks[t.team];
      if (p === undefined){ mv = "NEW"; cls = "new"; }
      else if (p > t.rank){ mv = "\u25B2" + (p - t.rank); cls = "up"; }
      else if (p < t.rank){ mv = "\u25BC" + (t.rank - p); cls = "down"; }
      else { mv = "\u2013"; }
    }
    const from = prev && prev.totals[t.team] !== undefined ? prev.totals[t.team] : 0;
    return `<div class="row${t.rank <= 3 ? " p" + t.rank : ""}">
      <div class="rank">${t.rank}</div>
      <div class="move ${cls}">${mv}</div>
      <div class="name">${esc(t.team)}</div>
      <div class="score" data-from="${from}" data-to="${t.total}">${fmt(from)}</div>
    </div>`;
  }).join("");
  shown = 0;
  if (STEP_REVEAL) board.insertAdjacentHTML("beforeend", '<div class="hint">Press Space or click to reveal</div>');
  else revealAll(70);
}

let revealing = false;
function reveal(res, then){
  revealing = true;
  document.body.classList.add("waiting");
  document.getElementById("sub").textContent = "";
  const board = document.getElementById("board");
  board.style.setProperty("--hold", HOLD_MS + "ms");
  board.innerHTML = '<div class="wait"><img src="d2-logo.png" alt=""><b>Scores coming up</b><div class="loadbar"><i></i></div></div>';
  setTimeout(() => {
    try{ render(res); if (then) then(); }
    catch(e){ status("Could not draw the board: " + e.message); }
    finally{ revealing = false; }
  }, HOLD_MS);
}
function status(msg){ document.getElementById("status").textContent = msg; }

let lastHash = null;
/* Hooks used by game.html, which shows this page as a slide. */
let lastRes = null;
function replay(){ if (lastRes && lastRes.teams.length && !revealing) reveal(lastRes, null); }
function allShown(){ return !revealing && shown >= rows().length; }
function busy(){ return revealing; }
function shownCount(){ return shown; }
async function poll(){
  if (revealing) return;
  try{
    /* Reads the scoresheet straight from this site (GitHub Pages), which has no hourly limit.
       The time stamp in the address makes sure a fresh copy comes back each time. */
    const r = await fetch(`${FILE}?t=${Date.now()}`, {cache:"no-store"});
    if (r.status === 404){ status(`No ${FILE} in the repo yet`); return; }
    if (!r.ok){ status(`Could not load the scoresheet (${r.status}). Retrying.`); return; }
    const buf = await r.arrayBuffer();
    const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(x => x.toString(16).padStart(2,"0")).join("");
    if (hash === lastHash) return;
    const res = parseScores(XLSX.read(buf, {type:"array"}));
    lastHash = hash;
    if (res.teams.length){
      /* Movement arrows only compare with an earlier board from the same game.
         The first board of the night (or a fresh test) shows none. */
      const stage = res.lastRound + (res.finalDone ? 1 : 0);
      const p = loadPrev();
      res.prev = (p && p.stage && p.stage < stage) ? p : null;
      savePrev(res.teams, stage);
    }
    lastRes = res;
    const stamp = () => document.getElementById("status").innerHTML = `Updated ${new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})};
    if (res.teams.length) reveal(res, stamp);
    else { render(res); status(`Scoresheet found, but it has no teams with scores yet (checked ${new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})})`); }
  }catch(e){ status("Connection problem. Retrying."); }
}

document.addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); return; }
  if (revealing) return;
  if (e.key === " " || e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); revealNext(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); hideLast(); }
  else if (e.key === "a" || e.key === "A"){ revealAll(); }
});
document.addEventListener("click", e => { if (e.target.closest("a") || revealing) return; revealNext(); });
poll(); setInterval(poll, POLL_SECONDS * 1000);
</script>
</body>
</html>
